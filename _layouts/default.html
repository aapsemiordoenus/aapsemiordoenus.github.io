<!DOCTYPE html>
<html lang="ko-kr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>{{ page.title }} :: {{ site.title }}</title>
  
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css?v={{ site.time | date: '%s' }}">
  
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
</head>

<body id="index">
  <div id="header">
    <nav>
      <h1><a href="{{ site.baseurl }}/">{{ site.title }}</a></h1>
      <div class="topnav">
        <a href="{{ site.baseurl }}/">Home</a>
        <a href="{{ site.baseurl }}/archive">Archive</a>
      </div>
    </nav>
  </div>

  <div id="wrap">
    <div class="section_1">
      <div id="article">
        {{ content }}
      </div>
    </div>

    <div class="section_2">
      <div class="sidebox blogimg_box">
        <div class="imgbox">
          <img src="{{ site.baseurl }}/assets/images/icon_47" alt="icon_47" onerror="this.src='https://via.placeholder.com/150'">
        </div>
        <span class="blog_name">aapsemiordoenus</span>
        <span class="blog_comment">{{ site.description }}</span>
      </div>

      <div class="sidebox category">
        <h3><span style="color: #9239df;">[- 𓆩 Index 𓆪 -]</span></h3>
        <div class="categorylist">
          {% for category in site.categories %}
            <li><a href="{{ site.baseurl }}/category/{{ category | first }}">{{ category | first }} ({{ category | last | size }})</a></li>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>

  <div id="footer">
    <div class="copyright">
      <a class="blogger" href="{{ site.baseurl }}/">aapsemiordoenus</a>
      <p>Designed by toDiva | Powered by GitHub</p>
    </div>
  </div>
</body>
</html>
